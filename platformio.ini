; =============================================================================
;  BiCopter flight controller - ESP32-S3 PowerFeather
;  FlySky FS-i6 (4 x PWM) | MPU6050 | 2 x MG996R tilt servos | 2 x ESC
; =============================================================================
;  Build:   pio run -e powerfeather
;  Flash:   pio run -e powerfeather -t upload
;  Console: pio device monitor        (type 'h' + Enter for help)
;
;  ESC calibration build (PROPELLERS OFF!):  pio run -e esc_calibration -t upload
; =============================================================================

[platformio]
default_envs = powerfeather
src_dir      = src
include_dir  = include
lib_dir      = lib

; ---- Settings shared by every environment -----------------------------------
[env]
platform  = espressif32 @ 8.0.0
board     = esp32s3_powerfeather
framework = arduino

board_build.partitions = default_8MB.csv

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

; Project libraries live in lib/<Name>/ ; the LDF finds them from the #includes
lib_ldf_mode = chain

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, direct
monitor_echo    = yes
upload_speed    = 921600
; PowerFeather runs native USB (TinyUSB): a 1200 baud "touch" drops it into the bootloader first,
; otherwise the first upload attempt fails while the USB port re-connects
board_upload.use_1200bps_touch   = yes
board_upload.wait_for_upload_port = yes

; ---- Normal flight firmware ---------------------------------------------------
[env:powerfeather]
build_type = release

; ---- ESC calibration: ESC outputs follow the throttle stick directly ----------
; Remove propellers. Flash, then: throttle HIGH -> power the ESCs -> wait for the
; beeps -> throttle LOW -> wait for the confirmation beeps -> re-flash 'powerfeather'.
[env:esc_calibration]
build_type = release
build_flags =
    ${env.build_flags}
    -DBICOPTER_ESC_CALIBRATION=1
