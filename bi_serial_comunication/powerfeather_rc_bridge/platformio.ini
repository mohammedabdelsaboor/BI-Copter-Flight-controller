; =============================================================================
;  ESP32-S3 PowerFeather receiver bridge
;  FS-iA6B (4 x PWM on GPIO36-39) -> UART TX GPIO44 -> ESP32-S3 SuperMini GPIO44
; =============================================================================
;  Build + flash:  pio run -t upload
;  Console:        pio device monitor      (prints the four channels 5 times a second)
; =============================================================================

[env:powerfeather]
platform  = espressif32 @ 8.0.0
board     = esp32s3_powerfeather
framework = arduino
board_build.partitions = default_8MB.csv
build_flags   = -Wall -Wextra -Wno-unused-parameter
lib_extra_dirs = ../common
lib_ldf_mode  = chain
monitor_speed = 115200
upload_speed  = 921600
; native USB (TinyUSB): the 1200 baud "touch" drops it into the bootloader first
board_upload.use_1200bps_touch    = yes
board_upload.wait_for_upload_port = yes
