; =============================================================================
;  BiCopter flight controller - ESP32-S3 SuperMini (S3FH4R2), receiver over UART
;  MPU6050 (SDA 8, SCL 9) | servos 3 (left), 4 (right) | ESCs 5 (left), 6 (right) | RC link from PowerFeather on GPIO44
; =============================================================================
;  Build:   pio run
;  Flash:   pio run -t upload
;  Console: pio device monitor        (type 'h' + Enter for help)
;
;  ESC calibration build (PROPELLERS OFF!):  pio run -e esc_calibration -t upload
; =============================================================================

[platformio]
default_envs = supermini
src_dir      = src
include_dir  = include
lib_dir      = lib

[env]
platform  = espressif32 @ 8.0.0
; No SuperMini board file in PlatformIO: the DevKitC-1 definition with the SuperMini's 4 MB flash and
; 2 MB quad PSRAM. USB is the chip's own USB port (USB CDC), as on the PowerFeather.
board     = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size         = 4MB
board_upload.flash_size        = 4MB
board_build.partitions         = default.csv
board_build.arduino.memory_type = qio_qspi

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Project libraries in lib/, the frame format shared with the bridge in ../common
lib_extra_dirs = ../common
lib_ldf_mode   = chain

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, direct
monitor_echo    = yes
upload_speed    = 921600

[env:supermini]
build_type = release

[env:esc_calibration]
build_type = release
build_flags =
    ${env.build_flags}
    -DBICOPTER_ESC_CALIBRATION=1
